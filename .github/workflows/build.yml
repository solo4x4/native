name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-33" \
                     "build-tools;33.0.2" \
                     "platform-tools" \
                     "ndk;25.2.9519653"

      - name: Install npm dependencies
        run: npm install

      - name: Download MediaPipe hand landmark model
        run: |
          mkdir -p android/app/src/main/assets
          wget -q -O android/app/src/main/assets/hand_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task"
          echo "Model downloaded: $(du -sh android/app/src/main/assets/hand_landmarker.task)"

      - name: Create index.js
        run: |
          cat > index.js << 'EOF'
          import {AppRegistry} from 'react-native';
          import App from './App';
          import {name as appName} from './app.json';
          AppRegistry.registerComponent(appName, () => App);
          EOF

      - name: Create app.json
        run: |
          cat > app.json << 'EOF'
          {
            "name": "GestureTVRemote",
            "displayName": "Gesture TV Remote"
          }
          EOF

      - name: Create babel.config.js
        run: |
          cat > babel.config.js << 'EOF'
          module.exports = {
            presets: ['module:@react-native/babel-preset'],
            plugins: ['react-native-reanimated/plugin'],
          };
          EOF

      - name: Create android resource files
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Gesture TV Remote</string>
          </resources>
          EOF

          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:editTextBackground">@drawable/rn_edit_text_material</item>
              </style>
          </resources>
          EOF

      - name: Create android/build.gradle
        run: |
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext {
                  buildToolsVersion = "33.0.2"
                  minSdkVersion    = 28
                  compileSdkVersion = 33
                  targetSdkVersion  = 33
                  ndkVersion        = "25.2.9519653"
                  kotlinVersion     = "1.8.0"
              }
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.1.1")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://www.jitpack.io' }
              }
          }
          EOF

      - name: Create android/gradle.properties
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          android.useAndroidX=true
          android.enableJetifier=true
          ReactNativeArchitectures=arm64-v8a
          newArchEnabled=false
          hermesEnabled=true
          IS_NEW_ARCHITECTURE_ENABLED=false
          IS_HERMES_ENABLED=true
          EOF

      - name: Create android/settings.gradle
        run: |
          cat > android/settings.gradle << 'EOF'
          pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
          plugins { id("com.facebook.react.settings") }
          extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
          rootProject.name = 'GestureTVRemote'
          include ':app'
          includeBuild('../node_modules/@react-native/gradle-plugin')
          EOF

      - name: Create android/app/build.gradle
        run: |
          cat > android/app/build.gradle << 'EOF'
          apply plugin: "com.android.application"
          apply plugin: "com.facebook.react"

          react { }

          android {
              ndkVersion rootProject.ext.ndkVersion
              compileSdkVersion rootProject.ext.compileSdkVersion
              namespace "com.gesturetvremote"

              defaultConfig {
                  applicationId "com.gesturetvremote"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode 1
                  versionName "1.0"
              }

              splits {
                  abi {
                      reset()
                      enable true
                      universalApk true
                      include "arm64-v8a"
                  }
              }

              buildTypes {
                  debug { debuggable true }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
                  }
              }
          }

          dependencies {
              implementation("com.facebook.react:react-android")
              implementation("com.facebook.react:hermes-android")
          }
          EOF

      - name: Create proguard-rules.pro
        run: echo "# Proguard rules" > android/app/proguard-rules.pro

      - name: Create MainActivity.java
        run: |
          mkdir -p android/app/src/main/java/com/gesturetvremote
          cat > android/app/src/main/java/com/gesturetvremote/MainActivity.java << 'EOF'
          package com.gesturetvremote;
          import com.facebook.react.ReactActivity;
          import com.facebook.react.ReactActivityDelegate;
          import com.facebook.react.defaults.DefaultNewArchitectureEntryPoint;
          import com.facebook.react.defaults.DefaultReactActivityDelegate;

          public class MainActivity extends ReactActivity {
            @Override
            protected String getMainComponentName() { return "GestureTVRemote"; }

            @Override
            protected ReactActivityDelegate createReactActivityDelegate() {
              return new DefaultReactActivityDelegate(
                this, getMainComponentName(),
                DefaultNewArchitectureEntryPoint.getFabricEnabled()
              );
            }
          }
          EOF

      - name: Generate Gradle wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            cd android
            gradle wrapper --gradle-version=8.3 --distribution-type=bin
          fi
          chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gesture-tv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
